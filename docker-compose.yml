# Local development database for MoneyMacros.
# Starts with a single command on a fresh clone (defaults below); a .env file,
# if present, overrides these values. See .env.example.
services:
  db:
    image: postgres:18
    container_name: moneymacros-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneymacros}
      POSTGRES_USER: ${POSTGRES_USER:-moneymacros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneymacros}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18 stores data under /var/lib/postgresql/18/docker, so the
      # volume is mounted one level up, at /var/lib/postgresql.
      - moneymacros_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneymacros} -d ${POSTGRES_DB:-moneymacros}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneymacros_pgdata:
